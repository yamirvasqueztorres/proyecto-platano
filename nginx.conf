events { worker_connections 1024; }
http {
  upstream frontend { server frontend:3000; }
  upstream backend { server backend:8000; }
  server {
    listen 80;
    client_max_body_size 15m;
    location /api/ { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /docs { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
